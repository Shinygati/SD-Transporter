name: Build iOS companion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate Xcode project
        run: python3 ios/tools/make_project.py
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          sh ios/tools/build-ipa.sh 2>&1 | tee ios-build.log
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pokewalker-iPhone-unsigned
          path: ios/build-local/Pokewalker-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pokewalker-iPhone-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 14
