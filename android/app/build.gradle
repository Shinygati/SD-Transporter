plugins {id "com.android.application"}
android {
 namespace "io.github.sdtransporter.pokewalker"
 compileSdk 36
 ndkVersion "29.0.14206865"
 defaultConfig {
  applicationId "io.github.sdtransporter.pokewalker"
  minSdk 26
  targetSdk 36
  versionCode 12
  versionName "1.6.3"
  externalNativeBuild {cmake {arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"}}
  ndk {abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"}
 }
 // Release signing from environment variables (build-all.sh sets them from
 // your keystore folder). Without them, e.g. in Android Studio, the project
 // still loads; sign there with Build > Generate Signed App Bundle or APK.
 def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
 signingConfigs {
  if (keystorePath) {
   release {
    storeFile file(keystorePath)
    storePassword System.getenv("ANDROID_STORE_PASSWORD")
    keyAlias System.getenv("ANDROID_KEY_ALIAS")
    keyPassword System.getenv("ANDROID_KEY_PASSWORD")
   }
  }
 }
 buildTypes {
  release {
   if (keystorePath) signingConfig signingConfigs.release
  }
 }
 externalNativeBuild {cmake {path "src/main/cpp/CMakeLists.txt"}}
 compileOptions {sourceCompatibility JavaVersion.VERSION_1_8;targetCompatibility JavaVersion.VERSION_1_8}
}
